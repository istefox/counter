name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Tuist
        run: brew install --cask tuist

      - name: Check tag matches app version
        run: |
          app_version=$(grep -o '"CFBundleShortVersionString": "[^"]*"' Project.swift | cut -d'"' -f4)
          if [ "v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CFBundleShortVersionString ${app_version}"
            exit 1
          fi

      # No Developer ID certificate on the runner: the Release build is ad-hoc signed.
      - name: Build Release
        run: |
          tuist generate --no-open
          xcodebuild -workspace AgentLimits.xcworkspace -scheme AgentLimits \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            OTHER_CODE_SIGN_FLAGS= \
            build

      - name: Package
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/AgentLimits.app \
            "AgentLimits-${GITHUB_REF_NAME}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "AgentLimits-${GITHUB_REF_NAME}.zip" \
            --title "AgentLimits ${GITHUB_REF_NAME}" --generate-notes
