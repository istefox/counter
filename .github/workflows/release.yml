name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Tuist
        run: brew install --cask tuist

      # A manual run releases the version in Project.swift and creates its tag.
      - name: Resolve release tag
        run: |
          app_version=$(grep -o '"CFBundleShortVersionString": "[^"]*"' Project.swift | cut -d'"' -f4)
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "TAG=v${app_version}" >> "$GITHUB_ENV"
          elif [ "v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CFBundleShortVersionString ${app_version}"
            exit 1
          else
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      # No Developer ID certificate on the runner: the Release build is ad-hoc signed.
      - name: Build Release
        run: |
          tuist generate --no-open
          xcodebuild -workspace AgentLimits.xcworkspace -scheme AgentLimits \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            OTHER_CODE_SIGN_FLAGS= \
            build

      - name: Package
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/AgentLimits.app \
            "AgentLimits-${TAG}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" "AgentLimits-${TAG}.zip" \
            --target "${GITHUB_SHA}" --title "AgentLimits ${TAG}" --generate-notes
